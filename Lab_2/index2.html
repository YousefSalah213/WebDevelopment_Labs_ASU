
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greet & Goodbye Demo</title>
    <link rel="stylesheet" href="lab2.css">
</head>
<body>
    <div class="container">
        <div class="card welcome-card">
            <h1 id="title">Welcome</h1>
            <div class="input-area">
                <input id="name" type="text" placeholder="Your name">
                <button id="greet">Greet</button>
            </div>
        </div>

        <div class="cards-row">
            <div class="card greeting-card">
                <h1 id="greeting-title">Hello!</h1>
                <div class="input-area">
                    <input id="greeting-name" type="text" placeholder="Your name">
                    <button id="greeting-button">Greet</button>
                </div>
                <ul id="list"></ul>
            </div>

            <div class="card goodbye-card">
                <h1 id="goodbye-title">Goodbye!</h1>
                <div class="input-area">
                    <input id="goodbye-name" type="text" placeholder="Your name">
                    <button id="goodbye-button">Greet</button>
                </div>
                <ul id="goodbye-list"></ul>
            </div>
        </div>
    </div>

    <script src="lab2.js"></script>
</body>
</html>
